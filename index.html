<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <header class="game-header">
      <h1 class="game-title">TETRIS</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Modo claro">🌙 Modo oscuro</button>
    </header>

    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section records" id="records-panel">
          <span class="label">RECORDS</span>
          <ol id="records-list" class="record-list"></ol>
          <div class="record-stats">
            <span>Mejor combo <b id="records-combo">0</b></span>
            <span>Líneas máx. <b id="records-lines">0</b></span>
          </div>
          <button id="records-reset" class="records-reset" type="button">Resetear records</button>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>

      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <p id="overlay-title">GAME OVER</p>
          <p id="overlay-score"></p>
          <p id="record-note" class="record-note hidden"></p>
          <form id="record-form" class="record-form hidden" autocomplete="off">
            <input id="record-name" type="text" maxlength="12" value="ANON" aria-label="Nombre" />
            <button type="submit" id="record-save">Guardar</button>
          </form>
          <ol id="overlay-records" class="record-list hidden"></ol>
          <button id="restart-btn">Reiniciar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="records.js"></script>
  <script src="game.js"></script>
</body>
</html>
